[package]
name = "sp1-recursion-gnark-ffi"
description = "FFI bindings to Gnark for SP1"
readme = "../../../README.md"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
rust-version = { workspace = true }

[dependencies]
slop-algebra = { workspace = true }
slop-symmetric = { workspace = true }
sp1-recursion-compiler = { workspace = true }
sp1-primitives = { workspace = true }
sp1-hypercube = { workspace = true }
sp1-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
num-bigint = { workspace = true }
cfg-if = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
sp1-gpu-groth16 = { path = "../../../sp1-gpu/crates/groth16" }
clap = { workspace = true, features = ["derive"], optional = true }
libloading = { version = "0.8", optional = true }

[build-dependencies]
bindgen = { workspace = true }
cfg-if = { workspace = true }

[dev-dependencies]
dirs = "5.0.1"
ark-bn254 = { version = "0.5", default-features = false, features = ["std", "curve"] }
ark-ec = { version = "0.5", default-features = false, features = ["parallel"] }
ark-ff = { version = "0.5", default-features = false, features = ["parallel"] }
ark-serialize = { version = "0.5", default-features = false }
sp1-gpu-plonk = { path = "../../../sp1-gpu/crates/plonk" }
sp1-verifier = { workspace = true, features = ["std"] }

[[example]]
name = "bench_groth16"
required-features = ["native"]

[[example]]
name = "bench_plonk"
required-features = ["native", "cuda"]

# Subprocess helper invoked by sp1-prover's recursion task to run the GPU
# Groth16 final wrap in a clean child process. Necessary because the parent
# process holds persistent HIP/CUDA contexts from the shard prover that
# deadlock the in-process Groth16 prover at the first MSM.
#
# The `cuda` feature gates the GPU-accelerated Groth16 code paths in
# sp1-gpu-groth16 (despite the name, it enables both HIP and CUDA
# backends — the runtime backend is selected by SP1_GPU_BACKEND / the
# sp1-gpu-sys build.rs). Without it, the helper compiles the CPU
# fallback path that expects `h_coefficients.bin` to be populated by
# the Go exporter (it isn't — H is computed on GPU) and runs Pippenger
# MSMs on CPU (taking >20 min on 5090).
[[bin]]
name = "groth16_gpu_helper"
path = "src/bin/groth16_gpu_helper.rs"
required-features = ["native", "cuda"]

[features]
native = ["dep:clap", "dep:libloading"]
groth16-cuda = []
cuda = ["sp1-gpu-groth16/cuda", "sp1-gpu-plonk/cuda"]

[lints]
workspace = true
